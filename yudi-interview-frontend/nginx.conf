server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Allow larger file uploads
    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # 后端实际监听 8000：见 yudi-interview-backend/run.sh 与 uvicorn 启动参数，
        # 且 vite 开发代理默认指向 http://localhost:8000。
        # 仓库内没有后端 Dockerfile 或 docker-compose 能提供 8080 的映射依据，故与后端保持一致。
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase timeout for long-running AI requests
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;

        # SSE 必须关闭代理缓冲，避免状态和心跳被聚合后延迟发送
        proxy_buffering off;
        proxy_cache off;
    }
}
