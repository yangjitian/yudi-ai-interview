[project]
name = "yudi-interview-backend"
version = "0.1.0"
description = "AI Interview Platform Python Backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.136.3",
  "uvicorn>=0.49.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "sqlalchemy>=2.0.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "asyncpg>=0.29.0",
  "redis>=5.0.0",
  "boto3>=1.34.0",
  "httpx>=0.27.0",
  "structlog>=24.0.0",
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-community>=0.3.0",
  "python-multipart>=0.0.9",
  "python-jose[cryptography]>=3.3.0",
  "cryptography>=42.0.0",
  "pypinyin>=0.53.0",
  "pypdf>=4.0.0",
  "python-docx>=1.1.0",
  "weasyprint>=60.0",
  "reportlab>=4.0.0",
  "aiofiles>=23.0.0",
  "jinja2>=3.1.0",
  "pgvector>=0.2.0",
  "psycopg2-binary>=2.9.0",
  "alembic>=1.13.0",
  "websocket-client>=1.8.0",
  "websockets>=12.0",
  "dashscope>=1.20.0",
  "dashscope-realtime>=0.1.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=4.0.0",
  "httpx>=0.27.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
indent-width = 2
target-version = "py312"
select = ["E", "F", "I", "N", "W", "ANN", "RUF"]
ignore = ["E501", "ANN101", "ANN102", "RUF001"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["ANN", "F401"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
